name: Corrigir switch de comissoes v2
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-switch-comissoes-v2.py'
      - '.github/workflows/patch-switch-comissoes-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python .github/scripts/patch-switch-comissoes-v2.py
      - name: Validar
        run: grep -q 'simpla-switch-comissoes-native-v2' index.html
      - name: Commit final e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: corrigir definitivamente switch de comissoes'
          git rm .github/scripts/patch-switch-comissoes-v2.py .github/workflows/patch-switch-comissoes-v2.yml
          git commit -m 'chore: remover patch temporario do switch de comissoes'
          git push
