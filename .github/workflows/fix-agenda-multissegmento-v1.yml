name: Fix agenda multissegmento v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-agenda-multissegmento-v1.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Corrigir rotulos multissegmento
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('agendar.html')
          s=p.read_text(encoding='utf-8')
          trocas={
            "CABELEIRO:{cliente:'Cliente',profissional:'Profissional',servico:'Serviço'}":"CABELEIREIRO:{cliente:'Cliente',profissional:'Profissional',servico:'Serviço'}",
            "PSICOLOGIA:{cliente:'Paciente',profissional:'Psicólogo',servico:'Sessço'}":"PSICOLOGIA:{cliente:'Paciente',profissional:'Psicólogo',servico:'Sessão'}",
            "PERSONAL:{cliente:'Aluno',profissional:'Personal',servico:'Sessço'}":"PERSONAL:{cliente:'Aluno',profissional:'Personal',servico:'Sessão'}",
            "PET:{cliente:'Tutor',Profissional:'Profissional',servico:'Serviço'}":"PET:{cliente:'Tutor',profissional:'Profissional',servico:'Serviço'}"
          }
          for a,b in trocas.items():
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agendar.html
          git commit -m "fix: corrigir rotulos da agenda multissegmento"
          git push origin main
