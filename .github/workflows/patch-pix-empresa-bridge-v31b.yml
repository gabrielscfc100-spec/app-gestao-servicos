name: Corrigir empresa no Pix v31b

on:
  push:
    paths:
      - '.github/workflows/patch-pix-empresa-bridge-v31b.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch-pix-empresa-bridge-v31b.py
      - name: Validar
        run: |
          grep -q 'simpla-pix-empresa-bridge-v31b' index.html
          grep -q "simpla-shell-v31b-pix-empresa" service-worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'fix: sincronizar empresa ativa com configuracao pix'
          git push
