name: Aplicar ajustes UX configuracoes e agenda
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-ux-config-agenda-v3.py'
      - '.github/workflows/patch-ux-config-agenda-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python .github/scripts/patch-ux-config-agenda-v3.py
      - name: Validar pacote
        run: |
          grep -q 'simpla-ux-config-agenda-v3' index.html
          grep -q 'cfg-dias-funcionamento' index.html
          grep -q 'diasFuncionamentoAgenda' index.html
          grep -q 'simplaAgendaHoje' index.html
          grep -q 'PERSONALIZAÇÃO DE TEMA' index.html || true
      - name: Commit final e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: aprimorar configuracoes e agenda'
          git rm .github/scripts/patch-ux-config-agenda-v3.py .github/workflows/patch-ux-config-agenda-v3.yml
          git commit -m 'chore: remover arquivos temporarios do patch ux'
          git push