name: Corrigir switches mobile globalmente
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python patch-mobile-switches-global-v7.py
      - name: Validar
        run: |
          grep -q 'simpla-mobile-switches-global-v7' index.html
          grep -q 'simpla-switch-text-v7' index.html
      - name: Commit final e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch-mobile-switches-global-v7.py .github/workflows/patch-mobile-switches-global-v7.yml
          git add -A
          git commit -m 'fix: corrigir todos os switches no mobile'
          git push
