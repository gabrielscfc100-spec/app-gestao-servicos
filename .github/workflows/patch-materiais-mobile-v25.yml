name: Corrigir materiais mobile v25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-materiais-mobile-v25.yml'
      - '.github/scripts/patch-materiais-mobile-v25.py'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção
        run: python .github/scripts/patch-materiais-mobile-v25.py
      - name: Validar
        run: |
          grep -q 'simpla-materiais-mobile-v25' index.html
          grep -q 'simpla-shell-v25-materiais-form-mobile' service-worker.js
          grep -q 'fin-inline-form' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'fix: corrigir formulario de materiais no mobile'
          git push
