name: Patch WhatsApp Menu Fix v79

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-whatsapp-menu-fix-v79.yml'
      - '.github/scripts/patch-whatsapp-menu-fix-v79.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/patch-whatsapp-menu-fix-v79.py
      - name: Validar
        run: |
          grep -q "data-cat.*WhatsApp e Automações\|waCat='WhatsApp e Automações'" index.html
          grep -q "cat==='WhatsApp e Automações'" index.html
          grep -q "simpla-wa78-container" index.html
          grep -q "simpla-shell-v79-whatsapp-menu-fix" service-worker.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: preservar aba WhatsApp nas configuracoes"
          git push
