name: Patch agenda multissegmento

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-agenda-multissegmento.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar patch multissegmento
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agendar.html
          git commit -m "feat: adaptar agenda publica ao modelo multissegmento"
          git push origin main
