name: Ajustar destino de notificacoes
on:
  push:
    paths:
      - 'scripts/patch-notificacao-destino.py'
      - '.github/workflows/patch-notificacao-destino.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/patch-notificacao-destino.py
      - name: Validar alteracao
        run: |
          grep -q "if(item.agendamento_id)" index.html
      - name: Commit e limpeza
        run: |
          rm -f scripts/patch-notificacao-destino.py .github/workflows/patch-notificacao-destino.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/patch-notificacao-destino.py .github/workflows/patch-notificacao-destino.yml
          git commit -m "feat: abrir agenda para notificacoes de alteracao" || exit 0
          git push
