name: Patch agenda bloqueio admin

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-agenda-bloqueio-admin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'SIMPLA_PATCH_BLOQUEIO_ADMIN_V1'
          if marker not in s:
              opener = '        function abrirModalBloqueio(horario) {'
              if opener not in s:
                  raise SystemExit('Função abrirModalBloqueio não encontrada')
              guard = "        async function abrirModalBloqueio(horario) {\n            // SIMPLA_PATCH_BLOQUEIO_ADMIN_V1\n            if(!usuarioEhAdmin()) {\n                alert('Apenas administradores podem bloquear horários da agenda.');\n                return;\n            }\n            if(!profissionais.some(p => p.ativo !== false)) {\n                try { await carregarProfissionaisCloud(); } catch(err) { console.error('Falha ao carregar profissionais antes do bloqueio:', err); }\n            }\n            if(typeof preencherProfissionaisBloqueioConfig === 'function') preencherProfissionaisBloqueioConfig();"
              s = s.replace(opener, guard, 1)
              ui = "\n<script id='simpla-patch-bloqueio-admin-v1'>\n(function(){\nfunction aplicarBloqueioAdminUI(){\nif(typeof usuarioEhAdmin!=='function')return;\nconst admin=usuarioEhAdmin();\ndocument.querySelectorAll('button[onclick^=\"abrirModalBloqueio\"]').forEach(function(btn){btn.style.display=admin?'':'none';btn.setAttribute('aria-hidden',admin?'false':'true');});\n}\nfunction iniciar(){aplicarBloqueioAdminUI();const alvo=document.getElementById('grid-horarios-agenda')||document.body;if(alvo)new MutationObserver(aplicarBloqueioAdminUI).observe(alvo,{childList:true,subtree:true});}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();\nwindow.addEventListener('load',aplicarBloqueioAdminUI);\n})();\n</script>\n"
              if '</body>' not in s:
                  raise SystemExit('Fechamento body não encontrado')
              s = s.replace('</body>', ui + '</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('Patch aplicado')
          else:
              print('Patch já aplicado')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restringir bloqueio de agenda ao administrador"
          git push origin main
