name: Corrigir rolagem da Agenda v15
on:
  push:
    paths:
      - '.github/scripts/patch-agenda-scroll-v15.py'
      - '.github/workflows/patch-agenda-scroll-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar patch
        run: python .github/scripts/patch-agenda-scroll-v15.py
      - name: Validar
        run: |
          grep -q 'simpla-agenda-scroll-v15' index.html
          grep -q 'agenda-v15-grid-scroll' index.html
          grep -q 'simpla-shell-v15-agenda-scroll' service-worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'fix: corrigir rolagem completa da agenda' || exit 0
          git push
