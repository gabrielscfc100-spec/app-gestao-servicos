name: Corrigir texto dos switches mobile por deslocamento

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python patch-mobile-switches-offset-v9.py
      - name: Validar
        run: |
          grep -q 'simpla-mobile-switch-offset-v9' index.html
          grep -q 'padding-left:58px' index.html
          grep -q 'simpla-shell-v9-switches-texto-deslocado' service-worker.js
      - name: Commit final e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch-mobile-switches-offset-v9.py .github/workflows/patch-mobile-switches-offset-v9.yml
          git add -A
          git commit -m 'fix: deslocar textos dos switches no mobile'
          git push
