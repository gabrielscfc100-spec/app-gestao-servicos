name: Corrigir empresa no Pix v30
on:
  push:
    paths:
      - '.github/scripts/patch-pix-empresa-v30.py'
      - '.github/workflows/patch-pix-empresa-v30.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar patch
        run: python .github/scripts/patch-pix-empresa-v30.py
      - name: Validar
        run: |
          grep -q "simpla-pix-empresa-v30" index.html
          grep -q "simpla-shell-v30-pix-empresa" service-worker.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "fix: corrigir identificacao da empresa no Pix" || exit 0
          git push origin main
