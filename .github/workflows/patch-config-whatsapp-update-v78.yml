name: Patch Config WhatsApp Update v78

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-config-whatsapp-update-v78.yml'
      - '.github/scripts/patch-config-whatsapp-update-v78.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/patch-config-whatsapp-update-v78.py
      - name: Validar
        run: |
          ! grep -q 'simpla-whatsapp-lazy-v77' index.html
          grep -q "WhatsApp e Automações" index.html
          grep -q "whatsapp-automacoes-v77.js?v=78" index.html
          grep -q "simpla-shell-v78-config-update-fix" service-worker.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: integrar WhatsApp ao menu e agilizar atualizacao"
          git push
