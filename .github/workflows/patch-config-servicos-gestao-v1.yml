name: Patch configuracao servicos gestao v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-config-servicos-gestao-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar painel de gestao por servico
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'SIMPLA_GESTAO_SERVICOS_V1'
          if marker in s:
              print('Patch ja aplicado.')
              raise SystemExit(0)

          anchor_html = '<hr style="border:0;border-top:1px solid #e2e8f0;margin:24px 0;"><h3 style="color: var(--cor-accent);"> Profissionais e Serviços</h3>'
          panel = '''<hr style="border:0;border-top:1px solid #e2e8f0;margin:24px 0;">
          <h3 style="color: var(--cor-accent);"> Gestão dos Serviços</h3>
          <p style="font-size:13px;color:#718096;margin-bottom:16px;text-transform:none;">Personalize regras administrativas de cada serviço. Estas configurações tratam apenas de gestão, agenda e relacionamento — não de conteúdo técnico ou clínico da profissão.</p>
          <div class="section-box-cfg" id="box-cfg-gestao-servicos">
            <div class="form-group"><label>Serviço</label><select id="cfg-gestao-servico" onchange="preencherGestaoServicoSelecionado()"><option value="">Carregando serviços...</option></select></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;">
              <div class="form-group" style="margin-bottom:0;"><label>Duração padrão (min)</label><input id="cfg-gestao-servico-duracao" type="number" min="5" max="1440" step="5"></div>
              <div class="form-group" style="margin-bottom:0;"><label>Retorno sugerido (dias)</label><input id="cfg-gestao-servico-retorno" type="number" min="1" max="3650" placeholder="Opcional"></div>
              <div class="form-group" style="margin-bottom:0;"><label>Recorrência padrão</label><select id="cfg-gestao-servico-recorrencia" onchange="atualizarCampoRecorrenciaPersonalizada()"><option value="NENHUMA">Sem recorrência</option><option value="DIARIA">Diária</option><option value="SEMANAL">Semanal</option><option value="QUINZENAL">Quinzenal</option><option value="MENSAL">Mensal</option><option value="PERSONALIZADA">Personalizada</option></select></div>
              <div class="form-group" id="cfg-gestao-servico-intervalo-wrap" style="margin-bottom:0;display:none;"><label>Intervalo personalizado (dias)</label><input id="cfg-gestao-servico-intervalo" type="number" min="1" max="3650"></div>
            </div>
            <div class="form-group" style="margin-top:12px;"><label>Observação de gestão</label><textarea id="cfg-gestao-servico-observacao" rows="2" style="text-transform:none;" placeholder="Ex.: sugerir novo agendamento após o atendimento."></textarea></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;"><button class="btn-salvar" type="button" onclick="salvarGestaoServico()">Salvar regras do serviço</button><button type="button" onclick="carregarConfiguracoesServicosGestao()" style="padding:10px 12px;">↻ Atualizar lista</button></div>
            <div id="cfg-gestao-servico-status" style="font-size:11px;color:#718096;margin-top:10px;text-transform:none;"></div>
          </div>
          <!-- SIMPLA_GESTAO_SERVICOS_V1 -->'''
          if anchor_html not in s:
              raise SystemExit('Ancora da secao Profissionais e Servicos nao encontrada.')
          s = s.replace(anchor_html, panel + anchor_html, 1)

          anchor_js = '        function carregarConfigEmpresaV2UI() {'
          js = r'''
        let servicosGestaoConfigCache = [];

        async function carregarConfiguracoesServicosGestao() {
            const select = document.getElementById('cfg-gestao-servico');
            const status = document.getElementById('cfg-gestao-servico-status');
            if(!select || !CloudDB || !empresaAtual?.id) return;
            if(status) status.textContent = 'Carregando serviços...';
            try {
                const { data, error } = await CloudDB
                    .from('servicos')
                    .select('id,nome,duracao_min,ativo,configuracao_gestao')
                    .eq('empresa_id', empresaAtual.id)
                    .order('nome', { ascending:true });
                if(error) throw error;
                servicosGestaoConfigCache = data || [];
                select.innerHTML = '<option value="">Selecione um serviço</option>' + servicosGestaoConfigCache.map(s => `<option value="${s.id}">${String(s.nome || 'SERVIÇO')}</option>`).join('');
                if(status) status.textContent = servicosGestaoConfigCache.length ? `${servicosGestaoConfigCache.length} serviço(s) disponível(is) para configuração.` : 'Nenhum serviço cadastrado.';
                preencherGestaoServicoSelecionado();
            } catch(err) {
                console.error(err);
                if(status) status.textContent = 'Não foi possível carregar as configurações dos serviços: ' + (err?.message || 'erro desconhecido');
            }
        }

        function preencherGestaoServicoSelecionado() {
            const id = document.getElementById('cfg-gestao-servico')?.value || '';
            const item = servicosGestaoConfigCache.find(s => String(s.id) === String(id));
            const cfg = item?.configuracao_gestao || {};
            const rec = cfg.recorrencia || {};
            const duracao = document.getElementById('cfg-gestao-servico-duracao');
            const retorno = document.getElementById('cfg-gestao-servico-retorno');
            const recorrencia = document.getElementById('cfg-gestao-servico-recorrencia');
            const intervalo = document.getElementById('cfg-gestao-servico-intervalo');
            const obs = document.getElementById('cfg-gestao-servico-observacao');
            if(duracao) duracao.value = item?.duracao_min || '';
            if(retorno) retorno.value = cfg.retorno_sugerido_dias ?? '';
            if(recorrencia) recorrencia.value = rec.tipo || 'NENHUMA';
            if(intervalo) intervalo.value = rec.tipo === 'PERSONALIZADA' ? (rec.intervalo_dias || '') : '';
            if(obs) obs.value = cfg.observacao_gestao || '';
            atualizarCampoRecorrenciaPersonalizada();
        }

        function atualizarCampoRecorrenciaPersonalizada() {
            const tipo = document.getElementById('cfg-gestao-servico-recorrencia')?.value || 'NENHUMA';
            const wrap = document.getElementById('cfg-gestao-servico-intervalo-wrap');
            if(wrap) wrap.style.display = tipo === 'PERSONALIZADA' ? 'block' : 'none';
        }

        async function salvarGestaoServico() {
            if(!validarAcessoPerfil('configuracoes','Seu perfil não pode alterar configurações de serviços.')) return;
            const servicoId = document.getElementById('cfg-gestao-servico')?.value || '';
            if(!servicoId) { alert('Selecione um serviço.'); return; }
            const duracao = Number(document.getElementById('cfg-gestao-servico-duracao')?.value || 0);
            const retornoRaw = document.getElementById('cfg-gestao-servico-retorno')?.value || '';
            const retorno = retornoRaw === '' ? null : Number(retornoRaw);
            const tipo = document.getElementById('cfg-gestao-servico-recorrencia')?.value || 'NENHUMA';
            const intervaloRaw = document.getElementById('cfg-gestao-servico-intervalo')?.value || '';
            const intervalo = intervaloRaw === '' ? null : Number(intervaloRaw);
            const observacao = document.getElementById('cfg-gestao-servico-observacao')?.value?.trim() || '';
            const status = document.getElementById('cfg-gestao-servico-status');
            if(status) status.textContent = 'Salvando...';
            try {
                const { error } = await CloudDB.rpc('configurar_gestao_servico_completo', {
                    p_servico_id: servicoId,
                    p_duracao_min: duracao,
                    p_retorno_sugerido_dias: retorno,
                    p_recorrencia_tipo: tipo,
                    p_recorrencia_intervalo: intervalo,
                    p_observacao_gestao: observacao
                });
                if(error) throw error;
                if(status) status.textContent = 'Configurações de gestão salvas com sucesso.';
                await carregarConfiguracoesServicosGestao();
                if(typeof carregarProfissionaisCloud === 'function') await carregarProfissionaisCloud();
                await registrarAuditoria('CONFIGURACOES','GESTAO_SERVICO_ALTERADA',servicoId,{duracaoMin:duracao,retornoDias:retorno,recorrencia:tipo});
            } catch(err) {
                console.error(err);
                if(status) status.textContent = 'Não foi possível salvar: ' + (err?.message || 'erro desconhecido');
            }
        }

'''
          if anchor_js not in s:
              raise SystemExit('Ancora JS de configuracao da empresa nao encontrada.')
          s = s.replace(anchor_js, js + anchor_js, 1)

          hook = "            if(tipoEl) tipoEl.value = empresaAtual.tipoNegocio || 'BARBEARIA';"
          if hook in s:
              s = s.replace(hook, hook + "\n            carregarConfiguracoesServicosGestao().catch(err => console.warn('Gestão de serviços:', err));", 1)
          else:
              print('Aviso: hook de carregamento automatico nao encontrado.')

          p.write_text(s, encoding='utf-8')
          print('Painel de gestao por servico aplicado.')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: adicionar gestao administrativa por servico"
          git push origin main
