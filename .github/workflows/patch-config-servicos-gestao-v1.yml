name: Patch configuracao servicos gestao v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-config-servicos-gestao-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar painel de gestao por servico
        run: |
          echo '
 ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: adicionar gestao administrativa por servico"
          git push origin main
