name: Corrigir resumo de caixa no mobile v23
on:
  push:
    paths:
      - '.github/workflows/patch-caixa-mobile-v23.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcao
        run: python .github/scripts/patch-caixa-mobile-v23.py
      - name: Validar
        run: |
          grep -q 'simpla-caixa-mobile-v23' index.html
          grep -q 'simpla-shell-v23-caixa-mobile' service-worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'fix: corrigir resumo de caixa no mobile' || exit 0
          git push
