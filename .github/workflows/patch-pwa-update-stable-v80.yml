name: Patch PWA Update Stable v80

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pwa-update-stable-v80.yml'
      - '.github/scripts/patch-pwa-update-stable-v80.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/patch-pwa-update-stable-v80.py
      - name: Validar
        run: |
          grep -q "simpla_pwa_update_aplicado" index.html
          grep -q "GET_VERSION" index.html
          grep -q "GET_VERSION" service-worker.js
          grep -q "simpla-shell-v80-update-stable" service-worker.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: impedir loop de atualizacao do PWA"
          git push
