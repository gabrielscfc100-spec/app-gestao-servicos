name: Configurar antecedencia do portal
on:
  push:
    paths:
      - '.github/workflows/patch-portal-antecedencia.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .tmp_patch_portal_antecedencia.py
      - name: Validar alteracao
        run: |
          grep -q "cfg-portal-antecedencia" index.html
          grep -q "salvarConfigPortalAntecedencia" index.html
          grep -q "cancelamento_portal_antecedencia_minutos" index.html
      - name: Commit e limpeza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .tmp_patch_portal_antecedencia.py
          rm .github/workflows/patch-portal-antecedencia.yml
          git add index.html .tmp_patch_portal_antecedencia.py .github/workflows/patch-portal-antecedencia.yml
          git commit -m "feat: configurar antecedencia do portal"
          git push
