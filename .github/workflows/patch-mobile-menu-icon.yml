name: Corrigir icone do menu mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python patch-mobile-menu-icon.py
      - name: Validar
        run: |
          grep -q 'simpla-mobile-menu-icon-v1' index.html
          grep -q 'box-shadow:0 9px 0 #fff,0 18px 0 #fff' index.html
      - name: Commit final e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch-mobile-menu-icon.py .github/workflows/patch-mobile-menu-icon.yml
          git add -A
          git commit -m 'fix: exibir icone do menu no mobile'
          git push
