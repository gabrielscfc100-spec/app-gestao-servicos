name: Patch Fix Multilembretes v73

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-fix-multilembretes-v73.yml'
      - '.github/scripts/patch-fix-multilembretes-v73.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/patch-fix-multilembretes-v73.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: manter multilembretes visiveis nas regras"
          git push
