name: Patch WhatsApp Template Validation v82

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-whatsapp-template-validation-v82.yml'
      - '.github/scripts/patch-whatsapp-template-validation-v82.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/patch-whatsapp-template-validation-v82.py
      - name: Validar
        run: |
          grep -q "whatsapp-validar-template" whatsapp-automacoes-v77.js
          grep -q "Validar na Meta" whatsapp-automacoes-v77.js
          grep -q "whatsapp-automacoes-v77.js?v=82" index.html
          grep -q "simpla-shell-v82-template-validation" service-worker.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp-automacoes-v77.js index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: validar templates WhatsApp na Meta"
          git push
