name: Ajustar configuracoes no mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python patch-mobile-config-spacing-v2.py
      - name: Validar
        run: |
          grep -q 'simpla-mobile-config-spacing-v2' index.html
          grep -q 'grid-template-columns:48px minmax(0,1fr) 70px' index.html
          grep -q 'flex:0 0 42px' index.html
      - name: Commit final e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch-mobile-config-spacing-v2.py .github/workflows/patch-mobile-config-spacing-v2.yml
          git add -A
          git commit -m 'fix: corrigir sobreposicao de switches no mobile'
          git push
