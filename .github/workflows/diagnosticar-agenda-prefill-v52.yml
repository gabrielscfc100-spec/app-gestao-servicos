name: Diagnosticar agenda prefill v52
on:
  push:
    paths:
      - '.github/scripts/diagnosticar-agenda-prefill-v52.py'
      - '.github/workflows/diagnosticar-agenda-prefill-v52.yml'
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar diagnostico
        run: python .github/scripts/diagnosticar-agenda-prefill-v52.py
      - name: Commit diagnostico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/diagnostico-agenda-prefill-v52.txt
          git commit -m 'chore: gerar diagnostico agenda prefill v52' || exit 0
          git push
