name: Ajustar recusa de solicitacao

on:
  push:
    paths:
      - '.github/workflows/patch-confirmacao-solicitacao.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar patch
        run: python tools/patch-confirmacao-solicitacao.py

      - name: Validar alteracao
        run: |
          grep -q "Recusar solicitação" index.html
          grep -q "Tem certeza que deseja recusar esta solicitação" index.html
          git diff --check

      - name: Commit e limpeza
        run: |
          rm -f tools/patch-confirmacao-solicitacao.py .github/workflows/patch-confirmacao-solicitacao.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: diferenciar recusa de solicitacao na agenda"
          git push
