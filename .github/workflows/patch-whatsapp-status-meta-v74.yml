name: Patch WhatsApp Status Meta v74

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-whatsapp-status-meta-v74.yml'
      - '.github/scripts/patch-whatsapp-status-meta-v74.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/patch-whatsapp-status-meta-v74.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: exibir status de entrega do WhatsApp"
          git push
