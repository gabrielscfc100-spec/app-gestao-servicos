name: Corrigir dias de funcionamento mobile v16
on:
  push:
    paths:
      - 'patch_cfg_dias_mobile_v16.py'
      - '.github/workflows/patch-cfg-dias-mobile-v16.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python patch_cfg_dias_mobile_v16.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'simpla-cfg-dias-mobile-v16' in s
          assert "simpla-shell-v16-dias-mobile" in Path('service-worker.js').read_text(encoding='utf-8')
          print('validado')
          PY
      - run: |
          rm -f patch_cfg_dias_mobile_v16.py .github/workflows/patch-cfg-dias-mobile-v16.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: permitir editar dias de funcionamento no mobile'
          git push
