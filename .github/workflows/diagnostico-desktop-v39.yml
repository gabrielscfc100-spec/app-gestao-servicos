name: Diagnostico desktop v39
on:
  push:
    paths:
      - '.github/workflows/diagnostico-desktop-v39.yml'
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar endpoint publico
        run: |
          set -x
          curl -L --fail --silent --show-error -o /tmp/app.html -w "HTTP=%{http_code}\nSIZE=%{size_download}\n" https://app-gestao-servicos.simpla.workers.dev/
          head -c 120 /tmp/app.html | tr '\n' ' ' || true
          echo
      - name: Validar scripts inline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          print('INLINE_SCRIPTS',len(scripts))
          erros=0
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              p=Path(f'/tmp/script-{i}.js');p.write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  erros+=1
                  print('ERRO_SCRIPT',i)
                  print(r.stderr)
          print('ERROS',erros)
          if erros: sys.exit(1)
          PY
      - name: Verificar versao PWA
        run: grep "CACHE_VERSION" service-worker.js | head -1
