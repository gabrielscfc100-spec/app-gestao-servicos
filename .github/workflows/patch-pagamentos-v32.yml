name: Pagamentos normalizados v32
on:
  push:
    paths:
      - '.github/scripts/patch-pagamentos-v32.py'
      - '.github/workflows/patch-pagamentos-v32.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Aplicar patch
        run: python .github/scripts/patch-pagamentos-v32.py
      - name: Validar
        run: |
          grep -q "simpla-pagamentos-v32" index.html
          grep -q "pagamentos_atendimento" index.html
          grep -q "TRANSFERÊNCIA" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: evoluir formas de pagamento do atendimento" || exit 0
          git push
