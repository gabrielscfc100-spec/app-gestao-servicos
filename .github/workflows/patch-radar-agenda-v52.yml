name: Ligar Radar de Retornos a Agenda v52
on:
  push:
    paths:
      - '.github/scripts/patch-radar-agenda-v52.py'
      - '.github/workflows/patch-radar-agenda-v52.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar Radar para Agenda
        run: python .github/scripts/patch-radar-agenda-v52.py
      - name: Validar
        run: |
          grep -q 'simpla-radar-agenda-v52' index.html
          grep -q 'agendarRetornoV52' index.html
          grep -q 'simpla-shell-v52-radar-agenda' service-worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'feat: ligar radar de retornos a agenda' || exit 0
          git push
