name: Implementar fluxo de telefone ja cadastrado v13
on:
  push:
    paths:
      - '.github/scripts/patch-telefone-cliente-v13.py'
      - '.github/workflows/patch-telefone-cliente-v13.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar patch
        run: python .github/scripts/patch-telefone-cliente-v13.py
      - name: Validar
        run: |
          grep -q 'simpla-telefone-cliente-v13' index.html
          grep -q 'modal-telefone-cliente-existente' index.html
          grep -q 'simpla-shell-v13-telefone-cliente' service-worker.js
      - name: Limpar arquivos temporarios
        run: |
          rm -f .github/scripts/patch-telefone-cliente-v13.py
          rm -f .github/workflows/patch-telefone-cliente-v13.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: tratar telefone ja cadastrado no agendamento' || exit 0
          git push
