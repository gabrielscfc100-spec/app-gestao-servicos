name: Corrigir gramatica da contagem v21
on:
  push:
    paths:
      - '.github/workflows/patch-gramatica-disponiveis-v21.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcao
        run: python .github/scripts/patch-gramatica-disponiveis-v21.py
      - name: Validar
        run: |
          grep -q 'simpla-gramatica-disponiveis-v21' index.html
          grep -q 'simpla-shell-v21-gramatica-contagem' service-worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'fix: corrigir singular de disponivel' || exit 0
          git push
