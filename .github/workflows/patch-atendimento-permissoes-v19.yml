name: Corrigir permissoes do Registro de Atendimento v19
on:
  push:
    paths:
      - '.github/scripts/patch-atendimento-permissoes-v19.py'
      - '.github/workflows/patch-atendimento-permissoes-v19.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar patch
        run: python .github/scripts/patch-atendimento-permissoes-v19.py
      - name: Validar
        run: |
          grep -q 'simpla-atendimento-permissoes-v19' index.html
          grep -q "'agenda','atendimento'" index.html
          grep -q 'simpla-shell-v19-atendimento-permissoes' service-worker.js
          grep -q 'abrirRegistroAtendimento' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'fix: liberar acesso ao registro de atendimento' || exit 0
          git push
