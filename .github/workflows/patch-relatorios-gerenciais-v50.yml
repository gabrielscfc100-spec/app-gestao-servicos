name: Relatorios gerenciais v50
on:
  push:
    paths:
      - '.github/workflows/patch-relatorios-gerenciais-v50.yml'
      - '.github/scripts/patch-relatorios-gerenciais-v50.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch-relatorios-gerenciais-v50.py
      - name: Validar
        run: |
          grep -F 'simpla-relatorios-gerenciais-v50' index.html
          grep -F 'Central de Relatórios Gerenciais' index.html
          grep -F 'exportarRelatorioGerencialExcelV50' index.html
          grep -F 'exportarRelatorioGerencialPDFV50' index.html
          grep -F "simpla-shell-v50-relatorios-gerenciais" service-worker.js
          ! grep -F 'setInterval(' .github/scripts/patch-relatorios-gerenciais-v50.py
          ! grep -F 'MutationObserver' .github/scripts/patch-relatorios-gerenciais-v50.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then
            echo 'Sem alteracoes'
            exit 0
          fi
          git commit -m 'feat: adicionar central de relatorios gerenciais'
          git push
