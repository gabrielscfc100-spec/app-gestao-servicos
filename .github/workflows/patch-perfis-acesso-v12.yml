name: Aplicar matriz de permissoes por perfil v12
on:
  push:
    paths:
      - '.github/scripts/patch-perfis-acesso-v12.py'
      - '.github/workflows/patch-perfis-acesso-v12.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar patch
        run: python .github/scripts/patch-perfis-acesso-v12.py
      - name: Validar
        run: |
          grep -q 'simpla-perfis-acesso-v12' index.html
          grep -q 'financeiroRelatorios: false' index.html
          grep -q 'catalogoEditar: false' index.html
          grep -q 'simpla-shell-v12-perfis-acesso' service-worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'feat: consolidar permissoes por perfil' || exit 0
          git push
