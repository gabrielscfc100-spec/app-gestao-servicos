name: Implementar atualização automática do PWA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python patch-pwa-update-manager.py
      - name: Validar
        run: |
          grep -q 'simpla-pwa-update-manager-v1' index.html
          grep -q 'Nova versão do SimplA disponível' index.html
          grep -q "setInterval(() => registroPWA?.update().catch(()=>{}), 5 \* 60 \* 1000)" index.html
      - name: Commit final e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch-pwa-update-manager.py .github/workflows/patch-pwa-update-manager.yml
          git add -A
          git commit -m 'feat: avisar e aplicar novas versoes do PWA'
          git push
