name: Implementar Pix com QR Code v27
on:
  push:
    paths:
      - '.github/workflows/patch-pix-qrcode-v27.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch-pix-qrcode-v27.py
      - name: Validar
        run: |
          grep -q "simpla-pix-qrcode-v27" index.html
          grep -q "Pix copia e cola" index.html
          grep -q "salvarConfiguracaoPixV27" index.html
          grep -q "simpla-shell-v27-pix-qrcode" service-worker.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "feat: gerar qr code pix no atendimento"
          git push
