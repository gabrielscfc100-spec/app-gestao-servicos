name: Diagnosticar atendimento v20
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-atendimento-v20.yml'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extrair trechos relevantes
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pats=["from('atendimentos')", 'from("atendimentos")', 'atendimentos', 'Finalizar', 'finalizar', 'carrinho', 'pagamento']
          out=[]
          for p in pats:
              start=0; c=0
              while True:
                  i=s.find(p,start)
                  if i<0: break
                  out.append(f"\n=== {p} @ {i} ===\n"+s[max(0,i-1800):min(len(s),i+4500)])
                  start=i+len(p); c+=1
                  if c>=8: break
          Path('.tmp_diag_atendimento_v20.txt').write_text('\n'.join(out),encoding='utf-8')
          print('trechos',len(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp_diag_atendimento_v20.txt
          git commit -m 'chore: diagnosticar fluxo de atendimento v20' || exit 0
          git push
