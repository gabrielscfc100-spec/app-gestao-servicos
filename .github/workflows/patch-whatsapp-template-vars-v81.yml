name: Patch WhatsApp Template Vars v81

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-whatsapp-template-vars-v81.yml'
      - '.github/scripts/patch-whatsapp-template-vars-v81.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/patch-whatsapp-template-vars-v81.py
      - name: Validar
        run: |
          grep -q "salvar_template_whatsapp_operacional_v2" whatsapp-automacoes-v77.js
          grep -q "Variáveis do corpo do template" whatsapp-automacoes-v77.js
          grep -q "whatsapp-automacoes-v77.js?v=81" index.html
          grep -q "simpla-shell-v81-template-vars" service-worker.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp-automacoes-v77.js index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: configurar variaveis dos templates WhatsApp"
          git push
