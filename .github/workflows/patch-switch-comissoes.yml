name: Corrigir contraste dos interruptores
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-switch-comissoes.py'
      - '.github/workflows/patch-switch-comissoes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python .github/scripts/patch-switch-comissoes.py
      - name: Validar
        run: |
          grep -q 'simpla-switch-comissoes-contrast-v1' index.html
          grep -q '#box-cfg-comissoes .cfg-switch-line' index.html
      - name: Commit e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: aumentar contraste dos interruptores de configuracao'
          git rm .github/scripts/patch-switch-comissoes.py .github/workflows/patch-switch-comissoes.yml
          git commit -m 'chore: remover patch temporario de contraste'
          git push
