name: Corrigir switches mobile definitivamente v8
on:
  push:
    paths:
      - 'tmp_patch_switches_mobile_final.py'
      - '.github/workflows/patch-switches-mobile-final-v8.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python tmp_patch_switches_mobile_final.py
      - name: Atualizar versão do service worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r"const CACHE_VERSION = '[^']+';", "const CACHE_VERSION = 'simpla-shell-v8-switches-mobile-final';", s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'SIMPLA_SWITCHES_MOBILE_FINAL_V8' index.html
          grep -q 'simpla-shell-v8-switches-mobile-final' service-worker.js
      - name: Commit funcional
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'fix: corrigir definitivamente switches das configuracoes no mobile' || true
      - name: Remover arquivos temporários
        run: |
          git rm -f tmp_patch_switches_mobile_final.py .github/workflows/patch-switches-mobile-final-v8.yml
          git commit -m 'chore: remover patch temporario dos switches mobile' || true
      - name: Push
        run: git push origin main
