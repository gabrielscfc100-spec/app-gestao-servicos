name: Corrigir dois blocos mobile restantes
on:
  push:
    paths:
      - 'patch-mobile-final-two-blocks.py'
      - '.github/workflows/patch-mobile-final-two-blocks.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar patch
        run: python patch-mobile-final-two-blocks.py
      - name: Validar alterações
        run: |
          grep -q 'simpla-mobile-two-blocks-final-v11' index.html
          grep -q 'simpla-shell-v11-dois-blocos-mobile' service-worker.js
      - name: Limpar temporários e publicar
        run: |
          rm patch-mobile-final-two-blocks.py
          rm .github/workflows/patch-mobile-final-two-blocks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js patch-mobile-final-two-blocks.py .github/workflows/patch-mobile-final-two-blocks.yml
          git commit -m 'fix: corrigir comissoes individuais e servicos no mobile'
          git push
