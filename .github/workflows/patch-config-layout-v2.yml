name: Aplicar novo layout das configuracoes
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-config-layout-v2.py'
      - '.github/workflows/patch-config-layout-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python .github/scripts/patch-config-layout-v2.py
      - name: Validar alteracoes
        run: |
          grep -q 'simpla-config-layout-v2' index.html
          grep -q 'cfg-v2-shell' index.html
          grep -q 'type="hidden" id="agenda-intervalo-input"' index.html
          if grep -q '⏱️ Tempo Padrão (Min):' index.html; then exit 1; fi
      - name: Commit final e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: reorganizar configuracoes e simplificar agenda'
          git rm .github/scripts/patch-config-layout-v2.py .github/workflows/patch-config-layout-v2.yml
          git commit -m 'chore: remover arquivos temporarios do patch'
          git push
