name: Corrigir empresa no Pix v31

on:
  push:
    paths:
      - '.github/workflows/patch-pix-empresa-v31.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch-pix-empresa-v31.py
      - name: Validar
        run: |
          grep -q 'simpla-pix-empresa-v31' index.html
          grep -q "simpla-shell-v31-pix-empresa" service-worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'fix: corrigir identificacao da empresa no pix'
          git push
