name: Patch Minha Prioridade Hoje v53

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-minha-prioridade-v53.yml'
      - '.github/scripts/patch-minha-prioridade-v53.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python .github/scripts/patch-minha-prioridade-v53.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then
            echo "Sem alteracoes para commit."
            exit 0
          fi
          git commit -m "feat: adicionar Minha Prioridade Hoje"
          git push
