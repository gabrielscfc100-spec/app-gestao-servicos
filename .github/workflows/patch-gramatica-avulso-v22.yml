name: Corrigir gramatica e cliente avulso v22
on:
  push:
    paths:
      - '.github/workflows/patch-gramatica-avulso-v22.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcao
        run: python .github/scripts/patch-gramatica-avulso-v22.py
      - name: Validar
        run: |
          grep -q 'simpla-cliente-avulso-v22' index.html
          grep -q 'Cliente avulso' index.html
          grep -q 'criar_cliente_atendimento' index.html
          grep -q 'simpla-shell-v22-cliente-avulso' service-worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'feat: adicionar cliente avulso ao registro de atendimento' || exit 0
          git push
