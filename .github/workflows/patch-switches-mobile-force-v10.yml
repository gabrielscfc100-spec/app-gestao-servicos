name: Corrigir switches mobile forçadamente v10
on:
  push:
    paths:
      - '.github/scripts/patch-switches-mobile-force-v10.py'
      - '.github/workflows/patch-switches-mobile-force-v10.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar patch
        run: python .github/scripts/patch-switches-mobile-force-v10.py
      - name: Validar
        run: |
          grep -q 'simpla-mobile-switch-force-v10' index.html
          grep -q 'simpla-shell-v10-switches-forcados' service-worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'fix: deslocar textos dos switches no mobile' || exit 0
          git push
