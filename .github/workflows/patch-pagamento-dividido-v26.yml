name: Implementar pagamento dividido v26
on:
  push:
    paths:
      - '.github/workflows/patch-pagamento-dividido-v26.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch-pagamento-dividido-v26.py
      - name: Validar
        run: |
          grep -q "PAGAMENTO DIVIDIDO" index.html
          grep -q "decomporPagamentoCaixa" index.html
          grep -q "simpla-shell-v26-pagamento-dividido" service-worker.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "feat: adicionar pagamento dividido ao atendimento"
          git push
