name: Fix agenda render bloqueio todos

on:
  push:
    paths:
      - 'scripts/fix_agenda_render_bloqueio_todos.py'
      - '.github/workflows/fix-agenda-render-bloqueio-todos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar patch
        run: python3 scripts/fix_agenda_render_bloqueio_todos.py

      - name: Validar diff
        run: git diff --check

      - name: Commit e limpeza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm scripts/fix_agenda_render_bloqueio_todos.py .github/workflows/fix-agenda-render-bloqueio-todos.yml
          git commit -m "fix: refletir bloqueio de todos na agenda geral"
          git push origin main
