name: Radar de retornos v51
on:
  push:
    paths:
      - '.github/scripts/patch-radar-retornos-v51.py'
      - '.github/workflows/patch-radar-retornos-v51.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar Radar de Retornos
        run: python .github/scripts/patch-radar-retornos-v51.py
      - name: Validar
        run: |
          grep -q 'simpla-radar-retornos-v51' index.html
          grep -q 'listar_oportunidades_retorno' index.html
          grep -q 'simpla-shell-v51-radar-retornos' service-worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'feat: adicionar radar de retornos ao dashboard' || exit 0
          git push
