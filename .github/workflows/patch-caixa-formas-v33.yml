name: Caixa por forma v33
on:
  push:
    paths:
      - '.github/scripts/patch-caixa-formas-v33.py'
      - '.github/workflows/patch-caixa-formas-v33.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar patch
        run: python .github/scripts/patch-caixa-formas-v33.py
      - name: Validar marcadores
        run: |
          grep -q 'simpla-caixa-formas-v33' index.html
          grep -q 'Recebimentos por forma de pagamento' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: adicionar resumo do caixa por forma de pagamento'
          git push origin main
