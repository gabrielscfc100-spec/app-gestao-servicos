name: Agenda conflitos v37
on:
  push:
    paths:
      - '.github/workflows/patch-agenda-conflitos-v37.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch-agenda-conflitos-v37.py
      - name: Validar marcadores
        run: |
          grep -q "SIMPLA agenda conflitos v37" index.html
          grep -q "simpla-shell-v37-agenda-conflitos" service-worker.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: validar conflitos e duracao na agenda"
          git push
