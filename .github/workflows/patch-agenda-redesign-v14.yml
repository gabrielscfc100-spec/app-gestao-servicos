name: Remodelar Agenda final v14
on:
  push:
    paths:
      - '.github/scripts/patch-agenda-redesign-v14.py'
      - '.github/workflows/patch-agenda-redesign-v14.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar remodelagem da Agenda
        run: python .github/scripts/patch-agenda-redesign-v14.py
      - name: Validar
        run: |
          grep -q 'simpla-agenda-redesign-v14' index.html
          grep -q 'simpla-shell-v14-agenda-remodelada' service-worker.js
          grep -q 'agenda-v14-resumo' index.html
          grep -q 'agenda-v14-nav' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'feat: concluir remodelagem da agenda' || exit 0
          git push
