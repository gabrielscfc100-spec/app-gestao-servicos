name: Aplicar Bottom Navigation v17
on:
  push:
    paths:
      - 'patch_bottom_nav_v17.py'
      - '.github/workflows/patch-bottom-nav-v17.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python patch_bottom_nav_v17.py
      - name: Validar alterações
        run: |
          grep -q 'simpla-bottom-nav-v17' index.html
          grep -q 'simpla-shell-v17-bottom-navigation' service-worker.js
      - name: Commit funcional
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'feat: adicionar bottom navigation no mobile' || true
          git rm -f patch_bottom_nav_v17.py .github/workflows/patch-bottom-nav-v17.yml
          git commit -m 'chore: limpar arquivos temporarios bottom nav' || true
          git push origin main
