name: Clientes dependentes v39
on:
  push:
    paths:
      - '.github/scripts/patch-clientes-dependentes-v39.py'
      - '.github/workflows/patch-clientes-dependentes-v39.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch-clientes-dependentes-v39.py
      - name: Validar
        run: |
          grep -q "SIMPLA clientes dependentes v39" index.html
          grep -q "responsavel_cliente_id" index.html
          grep -q "simpla-shell-v39-clientes-dependentes" service-worker.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m "feat: vincular clientes dependentes a responsaveis"
          git push
