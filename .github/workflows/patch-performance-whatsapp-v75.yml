name: Patch Performance WhatsApp v75

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-performance-whatsapp-v75.yml'
      - '.github/scripts/patch-performance-whatsapp-v75.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/patch-performance-whatsapp-v75.py
      - name: Validar hotfix
        run: |
          ! grep -q 'simpla-whatsapp-fix-multilembretes-v73' index.html
          grep -q 'simpla-whatsapp-multilembretes-v72' index.html
          grep -q 'simpla-shell-v75-performance-whatsapp' service-worker.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remover loop e estabilizar lembretes WhatsApp"
          git push
