name: Emergency Stability v76

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-stability-v76.yml'
      - '.github/scripts/emergency-stability-v76.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/emergency-stability-v76.py
      - name: Validar limpeza
        run: |
          if grep -q 'simpla-whatsapp-' index.html; then
            echo "Ainda existem blocos simpla-whatsapp no index.html"
            exit 1
          fi
          grep -q 'simpla-shell-v76-emergency-stability' service-worker.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remover carga excessiva do modulo WhatsApp"
          git push
