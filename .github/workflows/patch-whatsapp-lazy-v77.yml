name: Patch WhatsApp Lazy v77

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-whatsapp-lazy-v77.yml'
      - '.github/scripts/patch-whatsapp-lazy-v77.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/patch-whatsapp-lazy-v77.py
      - name: Validar arquitetura lazy
        run: |
          grep -q 'simpla-whatsapp-lazy-v77' index.html
          grep -q 'whatsapp-automacoes-v77.js' index.html
          grep -q 'simpla-shell-v77-whatsapp-lazy' service-worker.js
          test -f whatsapp-automacoes-v77.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: carregar WhatsApp sob demanda"
          git push
