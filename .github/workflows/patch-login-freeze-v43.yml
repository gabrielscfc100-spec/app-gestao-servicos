name: Login freeze v43
on:
  push:
    paths:
      - '.github/workflows/patch-login-freeze-v43.yml'
      - '.github/scripts/patch-login-freeze-v43.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch-login-freeze-v43.py
      - name: Validar
        run: |
          grep -F "attributeFilter:['class']" index.html
          ! grep -F "attributeFilter:['class','style']" index.html
          ! grep -F "setInterval(liberarLogin,1000)" index.html
          grep -F "simpla-shell-v43-login-freeze" service-worker.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
            exit 0
          fi
          git commit -m "fix: impedir loop que congelava login no desktop"
          git push
