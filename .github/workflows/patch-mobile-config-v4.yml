name: Corrigir definitivamente configuracoes mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar patch
        run: python patch-mobile-config-v4.py
      - name: Validar
        run: |
          grep -q 'simpla-mobile-config-v4-fix' index.html
          grep -q 'simpla-mobile-option-text' index.html
          grep -q "profissional-servico-item'))" index.html
      - name: Commit final e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch-mobile-config-v4.py .github/workflows/patch-mobile-config-v4.yml
          git add -A
          git commit -m 'fix: separar switches e textos no mobile'
          git push
