name: Diagnosticar atendimento 2 v20
on:
  push:
    paths: ['.github/workflows/diag-atendimento2-v20.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Extrair
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pats=['agendamentoEmRecebimentoId','concluirAgendamentoAposRecebimento','RecebimentoAgendamento','recebimentoAgendamento','abrirRegistroAtendimento','busca-cliente','finalizarAtendimento']
          out=[]
          for p in pats:
              start=0
              while True:
                  i=s.find(p,start)
                  if i<0: break
                  chunk=s[max(0,i-2200):min(len(s),i+4200)]
                  out.append('\n\n===== '+p+' =====\n'+chunk.replace(';',';\n').replace('{','{\n').replace('}','}\n'))
                  start=i+len(p)
                  if sum(1 for x in out if ('===== '+p+' =====') in x)>=10: break
          Path('.tmp_diag_atendimento2_v20.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp_diag_atendimento2_v20.txt
          git commit -m 'chore: detalhar fluxo atendimento v20' || exit 0
          git push
