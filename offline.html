<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075b73">
  <title>SimplA - Sem conexão</title>
  <style>
    *{box-sizing:border-box;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;color:#1a1c23;padding:24px}
    .box{max-width:430px;background:white;border:1px solid #e2e8f0;border-radius:16px;padding:28px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.06)}
    .logo{width:64px;height:64px;border-radius:16px;background:#075b73;color:#d4af37;display:grid;place-items:center;margin:0 auto 16px;font-size:30px;font-weight:900}
    h1{font-size:22px;margin:0 0 10px}
    p{color:#718096;line-height:1.5;margin:0 0 18px}
    button{border:0;border-radius:8px;background:#075b73;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <img src="./icons/icon-192.png" alt="SimplA" style="width:82px;height:82px;border-radius:18px;margin:0 auto 16px;display:block;">
    <h1>Você está sem conexão</h1>
    <p>O SimplA precisa de internet para carregar dados atualizados e executar operações no Supabase.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
